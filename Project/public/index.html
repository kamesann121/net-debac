<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ネットデバッグステータス</title>
  <link rel="stylesheet" href="/style/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  <img src="/assets/logo.png" alt="ロゴ" class="logo">
  <h1>⚡ ネットデバッグステータス ⚡</h1>
<!-- 既存のステータスの下に追加 -->
<div class="status" id="download">ダウンロード速度: 測定中...</div>
<div class="status" id="upload">アップロード速度: 測定中...</div>
<div class="status" id="dns">DNS応答時間: 測定中...</div>
<div class="status" id="ws">WebSocket接続: チェック中...</div>
<div class="status" id="browser">ブラウザ: 取得中...</div>
<div class="status" id="os">OS: 取得中...</div>
<div class="status" id="battery">バッテリー残量: 取得中...</div>
<div class="status" id="resolution">画面解像度: 取得中...</div>
<div class="status" id="location">位置情報: 取得中...</div>
<div class="status" id="connection">接続タイプ: 取得中...</div>

  <script src="/script/main.js"></script>
</body>
</html>
